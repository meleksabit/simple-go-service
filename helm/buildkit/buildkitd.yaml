apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: cicd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: buildkitd
  template:
    metadata:
      labels:
        app: buildkitd
    spec:
      containers:
      - name: buildkitd
        image: moby/buildkit:latest
        args: ["--addr", "tcp://0.0.0.0:1234"]
        securityContext:
          privileged: true   # required for BuildKit
        ports:
        - containerPort: 1234
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: cicd
spec:
  ports:
  - name: buildkitd
    port: 1234
    targetPort: 1234
  selector:
    app: buildkitd
